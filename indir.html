<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kazanç Hedefi - İndir</title>
<meta name="description" content="Kazanç Hedefi: günlük hedefini, giderlerini ve kazancını takip et. 7 gün ücretsiz dene.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #10141B; color: #F2F4F8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  svg { width: 112px; height: 112px; border-radius: 26px; }
  h1 { margin: 20px 0 6px; font-size: 28px; }
  p { margin: 0 0 28px; color: #A9B1BF; font-size: 16px; line-height: 1.5; }
  a.btn {
    display: block; padding: 16px 18px; margin: 0 0 12px; border-radius: 14px;
    background: #FFB020; color: #10141B; font-weight: 700; font-size: 17px; text-decoration: none;
  }
  a.btn.alt { background: #1E2530; color: #F2F4F8; }
  #durum { margin-top: 18px; font-size: 14px; color: #A9B1BF; min-height: 20px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 512 512" role="img" aria-label="Kazanç Hedefi">
    <rect width="512" height="512" fill="#10141B"/>
    <rect x="111" y="295" width="75" height="107" rx="14" fill="#946C1F"/>
    <rect x="219" y="235" width="75" height="167" rx="14" fill="#CC8F22"/>
    <rect x="326" y="175" width="75" height="227" rx="14" fill="#FFB020"/>
    <rect x="358" y="85" width="9" height="95" rx="4" fill="#fff"/>
    <polygon points="366,90 438,112 366,138" fill="#3DD68C"/>
  </svg>
  <h1>Kazanç Hedefi</h1>
  <p>Günlük hedefini, giderlerini ve kazancını takip et. 7 gün ücretsiz dene.</p>

  <a class="btn" id="ios" href="https://apps.apple.com/app/id6826781834">iPhone için App Store'dan indir</a>
  <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=com.taghedef">Android için Google Play'den indir</a>
  <div id="durum"></div>
</main>

<script>
(function () {
  var ua = navigator.userAgent || "";
  var iosUrl = "https://apps.apple.com/app/id6826781834";
  var androidUrl = "https://play.google.com/store/apps/details?id=com.taghedef";
  // iPadOS bazen Mac gibi görünür; dokunmatik ekranı varsa iPad say.
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var hedef = isIOS ? iosUrl : (isAndroid ? androidUrl : null);
  if (hedef) {
    document.getElementById("durum").textContent = "Mağazaya yönlendiriliyorsun…";
    window.location.replace(hedef);
  }
})();
</script>
</body>
</html>
